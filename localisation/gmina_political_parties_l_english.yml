 justice_system_reform: "Justice System Reform"
 desc_justice_system_reform: "Simplifying court procedures and holding judges accountable through disciplinary measures to improve trust in the judicial system."
 decentralization_of_public_power: "Decentralization of Public Power"
 desc_decentralization_of_public_power: "Increasing the responsibilities and autonomy of local governments to reduce bureaucracy and enhance efficiency."
 promotion_of_direct_democracy: "Foster Direct Democracy"
 desc_promotion_of_direct_democracy: "Promoting mechanisms for direct public participation in decision-making as an alternative to traditional representative democracy."
 introduction_of_magistrate: "Introduction of Magistrate"
 desc_introduction_of_magistrate: "Creating the position of justices of the peace to handle minor legal disputes and speed up judicial processes."
 defend_polish_national_interests_in_EU: "Protect Polish Interests"
 desc_defend_polish_national_interests_in_EU: "Advocating for the defense of Poland’s national sovereignty within the European Union and opposing excessive centralization."
 protect_family_values: "Protect Family Values"
 desc_protect_family_values: "Strengthening policies that benefit families, such as tax breaks for large families, to promote population growth and family stability."
 simplify_tax_system: "Simplify Tax System"
 desc_simplify_tax_system: "Streamlining the tax system by reducing its complexity, including the elimination of personal income tax (PIT)."
 strenghten_country_defence: "Stenghten Country Defence"
 desc_strenghten_country_defence: "Developing territorial defense forces and increasing military spending to ensure the country’s safety and independence."
 support_for_small_medium_enterprises: "Support for Enterprises"
 desc_support_for_small_medium_enterprises: "Easing tax burdens and reducing bureaucracy for small and medium-sized businesses to stimulate economic growth."
 protecting_poland_energetical_sovereignity: "Safeguard Energy Sovereignty"
 desc_protecting_poland_energetical_sovereignity: "Investing in renewable energy sources and reducing reliance on imported energy to ensure energy security."
 promote_patriotism: "Promote Patriotism"
 desc_promote_patriotism: "Enhancing the teaching of national history in schools to foster a sense of patriotism and awareness of Poland’s cultural heritage."
