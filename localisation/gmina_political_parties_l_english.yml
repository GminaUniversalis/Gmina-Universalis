#Konfederacja Aspects
 ruch_narodowy_leadership: "Ruch Narodowy Leadership"
 desc_ruch_narodowy_leadership: "The leaders of the National Movement within Konfederacja include Robert Winnicki, a prominent advocate of patriotic and traditional values, who emphasizes Poland's sovereignty and cultural heritage. Krzysztof Bosak, another key figure, is known for his intellectual approach to nationalism, focusing on economic independence and conservative social policies. Together, they represent the movement's commitment to strengthening national identity and resisting external influences on Polish politics."
 ruch_narodowy_ideology: "Ruch Narodowy Ideology"
 desc_ruch_narodowy_ideology: "The ideology of the National Movement within Konfederacja is rooted in nationalism, traditionalism, and conservatism, emphasizing the preservation of Poland's cultural and historical identity. It advocates for national sovereignty, economic independence, and a strong state that protects traditional values, such as family and faith. The movement opposes globalism, multiculturalism, and liberal social policies, aiming to foster a unified and self-reliant Polish nation."
 ruch_narodowy_demands: "Ruch Narodowy Demands"
 desc_ruch_narodowy_demands: "The demands of the National Movement within Konfederacja focus on protecting Poland's sovereignty, limiting foreign influence, and promoting national pride. They call for strict immigration controls, withdrawal from policies perceived as undermining Poland's independence within the EU, and prioritizing Polish businesses in the economy. Additionally, they advocate for the protection of traditional family structures, opposing liberal social reforms and supporting education rooted in patriotism and cultural heritage."
 partia_korwin_leadership: "KORWiN Leadership"
 desc_partia_korwin_leadership: "The leader of KORWiN, Janusz Korwin-Mikke, is a well-known libertarian and conservative figure, who has been a vocal advocate for economic freedom and minimal government intervention. Under his leadership, the party has attracted a following among those disillusioned with Poland's political establishment and those who advocate for a drastic shift toward a free-market economy. Korwin-Mikke's often controversial and outspoken nature adds to the party's polarizing yet distinct political identity."
 partia_korwin_ideology: "KORWiN Ideology"
 desc_partia_korwin_ideology: "KORWiN's ideology is rooted in libertarianism, advocating for minimal state intervention in both the economy and individual lives. The movement supports free markets, individual liberties, and lower taxes, rejecting most forms of government regulation. They emphasize personal responsibility and seek to reduce the size of the state to encourage entrepreneurial freedom and economic prosperity."
 partia_korwin_demands: "KORWiN Ideology"
 desc_partia_korwin_demands: "KORWiN calls for radical economic reforms, including cutting public spending, reducing taxes, and privatizing state-owned enterprises. They demand the dismantling of welfare programs to promote self-reliance, as well as a flat tax system that applies equally to all citizens. In social policies, they advocate for greater freedom of speech, freedom of association, and limited government interference in personal choices."
 partia_wolnosciowcy_leadership: "Wolnościowcy Leadership"
 desc_partia_wolnosciowcy_leadership: "Wolnościowcy is a smaller faction within Konfederacja but brings an influential voice advocating for a more radical libertarian stance. The party has garnered support from those dissatisfied with both left and right-wing government policies, especially among younger voters and entrepreneurs. Its leaders are focused on spreading the message of individual liberty and reducing state control over citizens' lives."
 partia_wolnosciowcy_ideology: "Wolnościowcy Ideology"
 desc_partia_wolnosciowcy_ideology: "Wolnościowcy are rooted in libertarianism and classical liberalism, advocating for the protection of individual rights and a free-market economy. They support reducing the size of the state and eliminating unnecessary regulations, seeking a society where personal freedom is paramount. The group aligns with the belief that voluntary exchanges and the rule of law should be the foundation of society."
 partia_wolnosciowcy_demands: "Wolnościowcy Demands"
 desc_partia_wolnosciowcy_demands: "The Wolnościowcy call for substantial tax cuts, the abolition of state subsidies, and the privatization of state-run industries. They demand decentralization of power, empowering local governments and individuals. They also advocate for reforming the judiciary system, ensuring fairness and independence, and liberalizing social policies such as drug decriminalization and marriage equality."
 monarchists_leadership: "Monarchists Leadership"
 desc_monarchists_leadership: "The Monarchist faction within Konfederacja is represented by Grzegorz Braun, who is a vocal proponent of restoring the monarchy as a way to strengthen Poland’s identity and moral framework. While not a major part of the mainstream political discourse, their ideas resonate with a minority of voters who feel that Poland’s past royal heritage can provide guidance for the nation’s future."
 monarchists_ideology: "Monarchists Ideology"
 desc_monarchists_ideology: "The Monarchists within Konfederacja support the return of the monarchy as a form of government, advocating for a constitutional or parliamentary monarchy where the king serves as a symbol of national unity and the protector of traditional values. Their ideology is deeply tied to nationalism, conservatism, and a strong sense of historical continuity, seeking to restore Poland's royal heritage."
 monarchists_demands: "Monarchists Demands"
 desc_monarchists_demands: "Monarchists call for constitutional reforms that would reinstate the Polish monarchy, ensuring that the monarch plays a unifying and symbolic role in the political system. They also advocate for the preservation of traditional social values, such as family, religion, and national identity, and oppose the rise of liberal or progressive ideologies in Polish politics. They emphasize patriotism and the moral leadership of a monarch in guiding the nation."
 pro_life_leadership: "Pro-Life Leadership"
 desc_pro_life_leadership: "The Pro-Life faction is represented by figures like Kaja Godek, a well-known activist who has been a leading advocate for stricter abortion laws in Poland. The group has a strong influence among voters who prioritize Christian moral values and those who believe in the importance of protecting life. Their activism and public campaigns, such as marches for life, have shaped debates on abortion and family policy in Poland."
 pro_life_ideology: "Pro-Life Ideology"
 desc_pro_life_ideology: "The Pro-Life faction in Konfederacja is grounded in Catholic conservatism and traditional family values, advocating for the protection of life from conception to natural death. The movement seeks to uphold ethical and moral standards based on Christian teachings, emphasizing the sanctity of life and opposing practices like abortion and euthanasia."
 pro_life_demands: "Pro-Life Demands"
 desc_pro_life_demands: "The Pro-Life group within Konfederacja demands a complete ban on abortion, including in cases of rape, incest, or fetal abnormalities. They also call for the protection of life at every stage, opposing euthanasia and assisted suicide. Furthermore, they advocate for stronger support for mothers and families, including greater financial assistance and resources for women facing unplanned pregnancies."
