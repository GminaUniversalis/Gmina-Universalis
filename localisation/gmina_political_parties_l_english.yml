 nowoczesna_enforece_equality: "Every Estate gains §G10§! loyalty."
 support_the_labor_market: "Support the Labor Market"
 desc_support_the_labor_market: "Supporting the labor market to create a more efficient and attractive labor force to stimulate economic growth"
 pro_family_policy: "Pro-Family Policy"
 desc_pro_family_policy: "Promoting policies that promote family rights, health, and education, as well as supporting the well-being of children and families"
 cooperation_with_eu: "Cooperation with European Union"
 desc_cooperation_with_eu: "Cooperating with European Union to promote a more harmonious and balanced political system"
