 mandatory_citizen_referendums: "Mandatory Refererendums"
 desc_mandatory_citizen_referendums: "Establishing binding citizen-initiated referendums, provided a minimum turnout is achieved, to give the public a stronger voice in key decisions."
 abolition_of_funding_of_political_parties: "Abolish Party Funding"
 desc_abolition_of_funding_of_political_parties: "Ending state subsidies for political parties to reduce financial dependency on the political system and promote fairness."
 increase_accountability_of_politicians: "Politician Accountability Reform"
