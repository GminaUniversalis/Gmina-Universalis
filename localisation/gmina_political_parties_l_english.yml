 radical_communism_doctrine:0 "Radical Communism"
 radical_communism_doctrine_desc:0 "Radical communism is a far-left political doctrine advocating for the complete abolition of private property and the establishment of a classless society through revolutionary means. It calls for the overthrow of capitalism and the immediate redistribution of wealth and resources. Radical communists often support centralized state control over production and aim to eliminate all forms of social inequality."
 social_democratic_doctrine:1 "Social Democratic"
 social_democratic_doctrine_desc:1 "Social democracy is a center-left political ideology that promotes a balance between a capitalist economy and government intervention to ensure social welfare and reduce inequality. It supports progressive taxation, universal healthcare, workers' rights, and robust public services, aiming to achieve greater social justice within a democratic framework."
 anarchism_doctrine:0 "Anarchism"
 anarchism_doctrine_desc:0 "Anarchism is a political philosophy that opposes all forms of hierarchical authority and advocates for self-governed societies based on voluntary cooperation. It rejects the state as inherently oppressive and seeks to establish systems of direct democracy or mutual aid. Anarchists may focus on abolishing capitalism, nationalism, and institutionalized power structures."
 marxism_doctrine:0 "Marxism"
 marxism_doctrine_desc:0 "Marxism is a socio-economic and political theory developed by Karl Marx and Friedrich Engels. It analyzes history through the lens of class struggle, arguing that capitalism is inherently exploitative and will inevitably be replaced by socialism and, ultimately, communism. Marxism emphasizes collective ownership of the means of production and the eventual establishment of a classless society."
 eco_socialism_doctrine:0 "Eco-Socialism"
 eco_socialism_doctrine_desc:0 "Eco-socialism combines environmentalism and socialism, advocating for a sustainable economy that prioritizes ecological health and social equity over profit. It criticizes both capitalism for exploiting natural resources and traditional socialism for underestimating environmental concerns. Eco-socialists promote renewable energy, localism, and a harmonious relationship between humans and the environment."
 democratic_socialism_doctrine:0 "Democratic Socialism"
 democratic_socialism_doctrine_desc:0 "Democratic socialism is a left-wing political ideology that seeks to achieve socialism through democratic processes rather than revolutionary means. It combines democratic governance with public ownership or regulation of key industries, aiming for economic equality, social justice, and enhanced workers' rights while preserving individual freedoms."
 eco_terrorism_doctrine:0 "Eco-Terrorism"
 eco_terrorism_doctrine_desc:0 "Eco-terrorism refers to acts of violence or sabotage committed in the name of environmental protection. It involves illegal actions, such as property destruction or intimidation, to stop activities deemed harmful to the environment, such as deforestation or pollution. Eco-terrorists prioritize ecological preservation over legal and ethical norms, often sparking significant public debate about their methods and goals."
