#Socialism
 socialism_sld:0 "SLD"
 socialism_sld_religion_desc: "Sojusz Lewicy Demokratycznej - The Democratic Left Alliance was a social-democratic political party in Poland. It was formed on 9 July 1991 as an electoral alliance of centre-left parties, and became a single party on 15 April 1999. It was the major coalition party in Poland between 1993 and 1997, and between 2001 and 2005, with four Prime ministers coming from the party - Józef Oleksy, W³odzimierz Cimoszewicz, Leszek Miller and Marek Belka. It then faded into opposition, overshadowed by the rise of Civic Platform and Law and Justice. In February 2020, the party initiated a process to absorb the Spring party, choosing the name New Left, and changing to a more modern logo. The party was a member of the Party of European Socialists and Progressive Alliance."
 socialism_up:0 "UP"
 socialism_up_religion_desc: "Unia Pracy - Labour Union is a minor social-democratic political party in Poland. Labour Union was formed in June 1992. The party contested the 1993 parliamentary elections, obtaining 7.28% of the popular vote and had 41 representatives elected to the lower house (Sejm). In the following parliamentary elections of 1997, UP received only 4.74% of votes, thereby falling short of the required 5% threshold for election to the Sejm."
 socialism_lewica:0 "Lewica"
 socialism_lewica_religion_desc: "Lewica - 'the Left' is a Polish coalition of left-wing political parties formed ahead of the 2019 parliamentary elections and continued thereafter. In parliament, it has been represented by the Left Coalition Parliamentary Club, with some interruptions between December 2021 and March 2023. Since 2023, the Left has been part of Donald Tusk's third government, in alliance with the Civic Coalition and Third Way, with Krzysztof Gawkowski serving as Deputy Prime Minister. The coalition emphasizes social justice, workers' rights, environmental protection, and progressive policies, including gender equality and LGBTQ+ rights. It aims to modernize Poland while addressing systemic inequalities and promoting a welfare-oriented state."
