#Events
 #Party Formation Events ###########################################################################################################
 politics.1.t:0 "Founding of Unia Demokratyczna"
 politics.1.d:0 "\n\n\n\n\n\n\nUnia Demokratyczna - The Democratic Union was a liberal Christian-democratic party in Poland. The party was founded in 1991 by Prime Minister, Christian Democrat Tadeusz Mazowiecki. The party had a market-socialist profile with Christian-democratic influence. Important members were Bronis³aw Geremek, Jacek Kuroª, Adam Michnik, Hanna Suchocka, Jan Rokita and Aleksander Hall."
 politics.1.a:0 "We will go with Unia Demokratyczna!"
 politics.1.b:0 "They are not worth our time."
 politics.101.t:0 "People want to join Unia Demokratyczna"
 politics.2.t:0 "Founding of Kongres Liberalno Demokratyczny"
 politics.2.d:0 "\n\n\n\n\n\n\nKongres Liberalno Demokratyczny - The Liberal Democratic Congress was a conservative-liberal political party in Poland. The party, led by Donald Tusk, had roots in the Solidarity movement. It advocated free market economy and individual liberty (however in Catholic understanding), rejected extremism and fanaticism and favoured European integration (in the form of European Union membership), rapid privatisation of the enterprises still owned by the Polish state and decentralisation of the government."
 politics.2.a:0 "We will go with Kongres Liberalno Demokratyczny!"
 politics.2.b:0 "They are not worth our time."
 politics.102.t:0 "People want to join Kongres Liberalno Demokratyczny"
 politics.3.t:0 "Founding of Konfederacja Polski Niepodleg³ej"
 politics.3.d:0 "\n\n\n\n\n\n\nKonfederacja Polski Niepodleg³ej - Confederation of Independent Poland was a Polish nationalist political party founded on 1 September 1979 by Leszek Moczulski and others declaring support for the pre-war traditions of Sanacja and Józef Pi³sudski. It was the first independent political party that was publicly proclaimed in the Eastern Bloc, it was however unrecognized by the communist People's Republic of Poland government and its chief activists were arrested several times. It didn't participate in the Polish Roundtable Negotiations with the communists."
 politics.3.a:0 "We will go with Konfederacja Polski Niepodleg³ej!"
 politics.3.b:0 "They are not worth our time."
 politics.103.t:0 "People want to join Konfederacja Polski Niepodleg³ej"
 politics.4.t:0 "Founding of Zjednoczenie Chrzeœcijaªsko-Narodowe"
 politics.4.d:0 "\n\n\n\n\n\n\nZjednoczenie Chrzeœcijaªsko-Narodowe - The Christian National Union was a Christian-democratic and nationalist political party in Poland. Established on 15 September 1989, the party traced its tradition to the Solidarity movement (both the trade union and the Solidarity Citizens' Committee), as well as pre-World War II National Democracy and Polish Christian Democratic Party. The party adhered to the Christian right, advocating social conservatism. From its foundation until 1994, the party was led by Wies³aw Chrzanowski, who was Marshal of the Sejm in 1991–1993."
 politics.4.a:0 "We will go with Zjednoczenie Chrzeœcijaªsko-Narodowe!"
 politics.4.b:0 "They are not worth our time."
 politics.104.t:0 "People want to join Zjednoczenie Chrzeœcijaªsko-Narodowe"
 politics.5.t:0 "Founding of Porozumienie Centrum"
 politics.5.d:0 "\n\n\n\n\n\n\nPorozumienie Centrum - The Centre Agreement was a Christian-democratic political party in Poland. It was established in 1990 and had its roots in the Solidarity trade union and its political arm, the Solidarity Citizens' Committee. Its main leader was Jaros³aw Kaczyªski. In its programme, the PC opposed socialism and was strongly anti-communist."
 politics.5.a:0 "We will go with Porozumienie Centrum!"
 politics.5.b:0 "They are not worth our time."
 politics.105.t:0 "People want to join Porozumienie Centrum"
 politics.6.t:0 "ZSL Rebrand"
 politics.6.d:0 "\n\n\n\n\n\n\nPolskie Stronnictwo Ludowwe - The Polish People's Party is an agrarian political party in Poland. Its history traces back to 1895, when it held the name People's Party. During the Second Polish Republic, the Polish People's Party was represented by a number of parties that held its name. They were all supportive of agrarian policies, although they spanned from the left-wing to the centre-right on the political spectrum. It was reformed to the People's Party shortly after the Sanacja regime took power. It took part into the formation of Polish government-in-exile during the World War II."
 politics.6.a:0 "We will go with Polskie Stronnictwo Ludowe!"
 politics.6.b:0 "Last man turns off the light."
 politics.106.t:0 "People want to join Polskie Stronnictwo Ludowe"
 politics.7.t:0 "Founding of Sojusz Lewicy Demokratycznej!"
 politics.7.d:0 "\n\n\n\n\n\n\nSojusz Lewicy Demokratycznej - The Democratic Left Alliance was a social-democratic political party in Poland. It was formed on 9 July 1991 as an electoral alliance of centre-left parties, and became a single party on 15 April 1999. It was the major coalition party in Poland between 1993 and 1997, and between 2001 and 2005, with four Prime ministers coming from the party - Józef Oleksy, W³odzimierz Cimoszewicz, Leszek Miller and Marek Belka. It then faded into opposition, overshadowed by the rise of Civic Platform and Law and Justice. In February 2020, the party initiated a process to absorb the Spring party, choosing the name New Left, and changing to a more modern logo. The party was a member of the Party of European Socialists and Progressive Alliance."
 politics.7.a:0 "We will go with Sojusz Lewicy Demokratycznej!"
 politics.7.b:0 "They are not worth our time."
 politics.107.t:0 "People want to join Sojusz Lewicy Demokratycznej!"
 politics.8.t:0 "Dissolution of the PZPR"
 politics.8.d:0 "\n\n\n\n\n\n\nStarting from January 1990, the collapse of the PZPR became inevitable. All over the country, public occupations of the party buildings started in order to prevent stealing the party's possessions and destroying or taking the archives. On 29 January 1990, XI Congress was held, which was supposed to recreate the party. Finally, the PZPR dissolved, and some of its members decided to establish two new social-democratic parties. They got over $1 million from the Communist Party of the Soviet Union known as the Moscow loan."
 politics.8.ud:0 "We will go with Unia Demokratyczna!"
 politics.8.kld:0 "We will go with Kongres Liberalno Demokratyczny!"
 politics.8.kpn:0 "We will go with Konfederacja Polski Niepodleg³ej!"
 politics.8.zchn:0 "We will go with Zjednoczenie Chrzeœcijaªsko-Narodowe!"
 politics.8.pc:0 "We will go with Porozumienie Centrum!"
 politics.8.psl:0 "We will go with Polskie Stronnictwo Ludowe!"
 politics.8.sld:0 "We will go with Sojusz Lewicy Demokratycznej!"
 politics.8.pzpr:0 "Last man turns off the light."
 politics.108.t:0 "What to do next?"
 politics.9.t:0 "Future of Stronnictwo Demokratyczne"
 politics.9.d:0 "\n\n\n\n\n\n\nWe are infiltrated by security services. Nobody trusts us anymore. Maybe it is time for a change?"
 politics.109.t:0 "What to do next?"
 politics.10.t:0 "Founding of Unia Pracy"
 politics.10.d:0 "\n\n\n\n\n\n\nUnia Pracy - Labour Union is a minor social-democratic political party in Poland. Labour Union was formed in June 1992. The party contested the 1993 parliamentary elections, obtaining 7.28% of the popular vote and had 41 representatives elected to the lower house (Sejm). In the following parliamentary elections of 1997, UP received only 4.74% of votes, thereby falling short of the required 5% threshold for election to the Sejm."
 politics.10.a:0 "We will go with Unia Pracy!"
 politics.10.b:0 "We will not divide The Left."
 politics.110.t:0 "People want to join Unia Pracy"
 politics.11.t:0 "Founding of Akcja Wyborcza Solidarnoœ¾!"
 politics.11.d:0 "\n\n\n\n\n\n\nAkcja Wyborcza Solidarnoœ¾ - Solidarity Electoral Action was a coalition of political parties in Poland, active from 1996 to 2001. AWS was the political arm of the Solidarity trade union, whose leader Lech Wa³²sa (also an AWS member), was President of Poland from 1990 to 1995, and the successor of the parties emerged from the fragmentation of the Solidarity Citizens' Committee. The coalition was led by Marian Krzaklewski and Jerzy Buzek, who was Prime Minister of Poland from 1997 to 2001. Today's main parties in Poland, Law and Justice and Civic Platform, came out from the ashes of AWS."
 politics.11.a:0 "It is time to unite the right wing!"
 politics.11.b:0 "The right wing will never be united."
 politics.111.t:0 "People want to join Akcja Wyborcza Solidarnoœ¾!"
 politics.12.t:0 "Founding of Unia Wolnoœci!"
 politics.12.d:0 "\n\n\n\n\n\n\nUnia Wolnoœci - Freedom Union was founded on 20 March 1994 out of the merger of the Democratic Union (Unia Demokratyczna, UD) and the Liberal Democratic Congress (Kongres Liberalno-Demokratyczny, KLD). Both of these parties had roots in the Solidarity trade union movement. It represented European democratic and liberal tradition, i.e., it advocated free market economy and individual liberty, rejected extremism and fanaticism, favoured European integration (in the form of European Union membership), rapid privatisation of the enterprises still owned by the Polish state and decentralisation of the government."
 politics.12.a:0 "It is time to unite the liberals!"
 politics.12.b:0 "The liberals will never be united."
 politics.112.t:0 "People want to join Unia Wolnoœci!"
 politics.13.t: "Founding of Polska Partia Uczciwoœci!"
 politics.13.d: "\n\n\n\n\n\n\nPolska Partia Uczciwoœci - a political party founded by Senator Pawel Koziol together with the director of his senatorial office Arkadiusz Czerepach. The PPU advocates respecting the age-old role of the Church and implementing changes on a reform basis. The party is eurosceptic. From a political point of view, the PPU is a typical populist party based on cheap electoral slogans, often mutually exclusive (e.g. lower taxes, higher social benefits). Of the political parties that exist in reality, the PPU bears the greatest similarity to the Samoobrona RP."
 politics.13.a:0 ""We do not care about careers, but the good of the country!""
 politics.13.b:0 "People will never follow this drunken hog"
 politics.14.t: "Founding of Prawo i Sprawiedliwoœ¾!"
 politics.14.d: "\n\n\n\n\n\n\nLaw and Justice - Polish political party founded at a congress on May 29, 2001 by brothers Lech and Jaros³aw Kaczyªski. It was formed on the wave of popularity gained by Lech Kaczyªski during his tenure as Minister of Justice and Attorney General in the AWS. The party's ideology is described as right-wing. The party's doctrine, is a combination of social and national conservatism, solidarity, interventionism, Christian democracy. The party is described by some political commentators and media as a populist and Euroskeptic grouping."
 politics.14.a:0 "From the ashes of the past, we will unite the right wing!"
 politics.14.b:0 "This party will never be appeasing for masses"
 politics.114.t: "People want to join Prawo i Sprawiedliwoœ¾"
 politics.15.t: "Founding of Platforma Obywatelska!"
 politics.15.d: "\n\n\n\n\n\n\nThe Civic Platform (PO) was founded on January 24, 2001, initially as an association and later registered as a political party on March 5, 2002. It emerged from the fragmentation of several political groups, including the Liberal Democratic Congress and elements of the Polish Christian Democratic and center-right movements. Key figures in the party's early years included Donald Tusk, who served as its leader for many years, and other prominent politicians such as Andrzej Olechowski and Maciej P³a¿yªski. The party advocates for liberal economic policies, democratic values, European integration, and social market economy principles. Over time, PO has become known for its pro-European Union stance and commitment to democratic governance, although it has evolved toward a more centrist position. It has also supported social reforms and initiatives aimed at strengthening civil liberties and reducing state intervention in the economy."
 politics.15.a: "A new chapter for Poland's prosperity and unity!"
 politics.15.b: "A path of uncertainty, risks lie ahead."
 politics.115.t: "People want to join Platforma Obywatleska"
 politics.16.t: "Founding of Ruch Palikota!"
 politics.16.d: "\n\n\n\n\n\n\nRuch Palikota was established in 2011 by Janusz Palikot, a former member of the Civic Platform. It emerged as an anti-establishment force focused on secularism, social liberalism, and progressive reforms. The party quickly gained attention with its bold stances on issues like marijuana legalization, women's rights, and church-state separation. The party's main political figures included Janusz Palikot and a range of former members of the Civic Platform and left-wing movements. The party emphasized modernization, individual freedoms, and greater social tolerance. However, internal conflicts and a lack of political cohesion led to its decline."
 politics.16.a: "A fresh, bold approach for change!"
 politics.16.b: "Too fragmented, lacks clear vision."
 politics.116.t: "People want to join Ruch Palikota"
 politics.17.t: "Founding of Nowoczesna!"
 politics.17.d: "\n\n\n\n\n\n\nNowoczesna, founded in 2015 by Ryszard Petru, is a centrist-liberal political party focusing on economic reforms, market-driven policies, and social liberalism. It was founded as a response to the perceived stagnation in Polish politics and aimed to bring a new, modern approach to governance. The party joined the European Liberal Democrat and Reform Party (ALDE) in 2016 and has since advocated for fiscal responsibility, individual freedoms, and a stronger European Union. It briefly gained momentum, especially among younger voters, but faced challenges in sustaining long-term political support."
 politics.17.a: "A new era of progressive change and innovation!"
 politics.17.b: "Lacks the power to reshape Poland's future."
 politics.117.t: "People want to join Nowoczesna"
 politics.18.t: "Founding of Kukiz'15"
 politics.18.d: "\n\n\n\n\n\n\nKukiz'15 was founded in 2015 by Pawe³ Kukiz, a popular rock musician turned politician. Initially, it was a political movement aiming to challenge the established political elites and promote direct democracy, such as the introduction of the single-member district voting system. The party attracted a mix of right-wing, libertarian, and anti-establishment figures, united by a desire for systemic change. Kukiz'15 initially gained significant support due to its populist stance, but internal conflicts and lack of cohesion led to its gradual decline. Despite this, the party remained influential in advocating for electoral reform and anti-corruption measures."
 politics.18.a: "A new force for real change in Poland!"
 politics.18.b: "Populist rhetoric with no lasting impact."
 politics.118.t: "People want to join Kukiz'15"
 politics.19.t: "Founding of Nowa Lewica!"
 politics.19.d: "\n\n\n\n\n\n\nLewica is a left-wing coalition of parties formed in 2019, including members from the Left Democratic Alliance (SLD), the Spring party (Wiosna), and the Razem party. It was established to unite the Polish left under one banner and promote progressive values, including social justice, workers' rights, and environmental sustainability. The coalition has been critical of government policies that it perceives as anti-social and anti-democratic. With a focus on reducing inequality and enhancing social welfare, Lewica has become a key player in Poland's left-wing politics."
 politics.19.a: "A united voice for Poland's progressive future!"
 politics.19.b: "Divided, with limited influence on change."
 politics.119.t: "People want to join Nowa Lewica"
 politics.20.t: "Founding of Konfederacja!"
 politics.20.d: "\n\n\n\n\n\n\nKonfederacja, established in 2018, is a far-right political alliance combining nationalist, libertarian, and conservative ideologies. It emerged as a response to what its members see as the failure of the mainstream political parties to address issues like national sovereignty, immigration, and traditional values. The coalition includes figures from the National Movement (Ruch Narodowy), Janusz Korwin-Mikke's Liberty party (Wolnoœ¾), and other right-wing factions. Konfederacja advocates for a strict interpretation of national interests, minimal state intervention, and a strong stance against European Union influence."
 politics.20.a: "A bold defense of Poland's sovereignty and values!"
 politics.20.b: "Dangerous path, undermining democracy and unity."
 politics.120.t: "People want to join Konfederacja"
 politics.21.t: "Founding of Trzecia Droga!"
 politics.21.d: "\n\n\n\n\n\n\nTrzecia Droga, or Third Way, is a centrist coalition formed in 2023, bringing together the Polish People's Party (PSL) and the modern wing of the Social Democratic Party. It focuses on pragmatic policies, bridging the divide between conservative and progressive ideas. The coalition emphasizes economic development, rural support, social cohesion, and European cooperation. Trzecia Droga seeks to offer a moderate alternative to the polarized political landscape, promoting a balanced approach to issues such as agriculture, economic reform, and social welfare."
 politics.21.a: "A balanced path for Poland's growth and unity!"
 politics.21.b: "Uncertain, torn between conflicting interests."
 politics.121.t: "People want to join Trzecia Droga!"
 politics.22.t: "Founding of Liga Polskich Rodzin!"
 politics.22.d: "\n\n\n\n\n\n\nLiga Polskich Rodzin (League of Polish Families) was a nationalist and socially conservative political party in Poland, active mainly in the early 2000s. The party's members primarily came from Catholic and nationalist circles, with strong ties to organizations like the All-Polish Youth (M³odzie¿ Wszechpolska). Its most prominent leader was Roman Giertych, who served as the party's chairman and later became Poland's Deputy Prime Minister and Minister of Education. LPR promoted a worldview centered on Catholic social teaching, nationalism, and opposition to European federalism."
 politics.22.a: "Finally, a party defending tradition and national values!"
 politics.22.b: "Promotes exclusion and undermines modern democratic principles."
 politics.122.t: "People want to join Liga Polskich Rodzin!"
 politics.23.t: "Founding of Samooborona!"
 politics.23.d: "\n\n\n\n\n\n\nSamoobrona Rzeczpospolitej Polskiej (Self-Defense of the Republic of Poland) was a populist and agrarian political party in Poland, active from the early 1990s to the late 2000s. Its members were primarily small farmers, rural workers, and individuals disillusioned with mainstream political elites. The party was led by Andrzej Lepper, a charismatic and controversial figure who served as Deputy Prime Minister and Minister of Agriculture. Samoobrona's ideology combined left-wing economic policies, such as state intervention and social welfare, with anti-establishment rhetoric and a focus on protecting Polish agriculture."
 politics.23.a: "Finally, someone standing up for rural communities and farmers!"
 politics.23.b: "Populism and scandals won’t solve real economic problems."
 politics.123.t: "People want to join Samooobrona!"
 
 #P2050 Harmonization ################################################################################

 gmina_harmonization.1.t: "Coalition with Communists"
 gmina_harmonization.1.d: "\n\n\n\n\n\n\nThe agreement was signed in a room that still has the hooks where the old portraits used to hang.\n\nOur negotiators went in promising a new quality in politics and came out having conceded the Ministry of Heavy Industry, which nobody on our side had realised still existed. The comrades proved unexpectedly easy to work with. They have been out of government for so long that they had stopped expecting to be asked, and they arrived with fully costed proposals while our delegation was still workshopping a slogan.\n\nIn [Root.Capital.GetCapitalName] the change is largely a matter of vocabulary. What we call civic dialogue they call consultation with the working masses, and since both produce the same committee, nobody has pressed the point. The party daily now prints our columns on page three, directly beneath a feature on grain deliveries.\n\nThe Communists are part of our coalition. We have been asked, politely and several times, to stop describing this as a surprise.\n"
 gmina_harmonization.1.d.pzpr: "\n\n\n\n\n\n\nThe delegation that met us in [communist_province.GetName] arrived with a mandate from a body that has never formally been dissolved, only adjourned.\n\nThey were courteous, extremely well briefed, and referred throughout to our programme as the current stage. Their chairman explained that the Party has always supported dialogue, produced minutes from 1981 to prove it, and asked whether we would prefer the agreement signed or simply entered into the protocol.\n\nIn [Root.Capital.GetCapitalName] the practical change is that four ministries now file weekly summaries nobody requested, in a format last used forty years ago and, everyone quietly concedes, a good deal clearer than ours."
 gmina_harmonization.1.d.sd: "\n\n\n\n\n\n\nSD agreed to everything before we had finished the opening sentence, which our negotiators found unsettling rather than encouraging.\n\nThis is a party with generations of practice at being the smaller partner. It knows precisely how much it will be offered, accepts without theatre, and has never once been blamed for anything a government did. Its people in [communist_province.GetName] run the workshops, the guilds and the licences, and have outlasted every arrangement they were ever part of.\n\nIn 1989 they changed sides in a single afternoon and made a government possible. Nobody in this room has forgotten it."
 gmina_harmonization.1.d.zsl: "\n\n\n\n\n\n\nThe ZSL delegation came in from the villages around [communist_province.GetName] and spent the first hour on grain prices, which they considered to be the actual negotiation.\n\nThey are not interested in our vision and said so pleasantly. They want the agricultural budget, the rural roads and the dairy quotas, and in exchange they will vote for very nearly anything. Their chairman has sat in coalitions with four mutually hostile governments and fully expects to sit in several more.\n\nIn [Root.Capital.GetCapitalName] this is presented as broadening our base. In the countryside it is presented as the ministry changing hands again."
 gmina_harmonization.1.a: "Uniting for equality, justice, and collective progress."
 gmina_harmonization.2.t: "Coalition with Unia Demokratyczna"
 gmina_harmonization.2.d: "\n\n\n\n\n\n\nTalks with Unia Demokratyczna took four months, which both delegations regard as brisk.\n\nThey arrived with position papers on everything, including the correct format for future position papers. Every clause was examined from first principles by people who had personally helped write the constitution and were not inclined to be hurried through it. Twice the negotiations were suspended so that a point of principle could be settled, and twice the settlement changed nothing whatsoever.\n\nIn [Root.Capital.GetCapitalName] their people have quietly taken charge of the parts of government that require somebody to read the entire document. This has improved our legislation and lengthened our meetings in roughly equal measure.\n\nUnia Demokratyczna is part of our coalition, and has already proposed a review of the procedure by which the coalition was formed.\n"
 gmina_harmonization.2.a: "A strong step toward deepening democracy and unity."
 gmina_harmonization.3.t: "Coalition with Kongres Liberalno-Demokratyczny"
 gmina_harmonization.3.d: "\n\n\n\n\n\n\nThe Kongres Liberalno-Demokratyczny delegation came up from Gdaªsk, read our fiscal programme and asked, very pleasantly, who had checked the arithmetic.\n\nNobody had. What followed was less a negotiation than an audit. Three of our flagship commitments were withdrawn before lunch on the grounds that they could not be paid for, and a fourth survived only after being renamed. Their people discuss the state the way a receiver discusses an estate: with genuine sympathy, and a list.\n\nIn [Root.Capital.GetCapitalName] the treasury now runs on their spreadsheets. Our deputies have started asking what a thing costs before announcing it, which is a novelty for everyone concerned.\n\nKongres Liberalno-Demokratyczny is part of our coalition, and has already sold two buildings we did not know we owned.\n"
 gmina_harmonization.3.a: "A partnership for progress and economic freedom."
 gmina_harmonization.4.t: "Coalition with Unia Wolnoœci"
 gmina_harmonization.4.d: "\n\n\n\n\n\n\nUnia Wolnoœci agreed to join us on the third attempt, having twice walked out over wording.\n\nTheir negotiators are lawyers and professors who have all done this before, mostly in coalitions that ended badly, and they arrived with an unusually close interest in the exit clauses. Our people found this faintly insulting until they read the clauses and realised they were the ones being protected by them.\n\nIn [Root.Capital.GetCapitalName] the justice ministry has acquired a tone it has not had in years: dry, exact and entirely immune to enthusiasm. Several of our more imaginative announcements have quietly failed to survive legal review.\n\nUnia Wolnoœci is part of our coalition, and has put the date of the first review in writing.\n"
 gmina_harmonization.4.a: "A coalition grounded in liberty and social justice."
 gmina_harmonization.5.t: "Coalition with Platforma Obywatelska"
 gmina_harmonization.5.d: "\n\n\n\n\n\n\nThe agreement with Platforma Obywatelska was announced on a Thursday and surprised nobody, including the two people who signed it.\n\nCommentators had been predicting it since before either party admitted it was possible, and the chief accomplishment of the talks was establishing which of us had thought of it first. Both delegations insist they made the opening approach, and both have produced dated notes to prove it.\n\nIn [Root.Capital.GetCapitalName] remarkably little has visibly changed. Their side offers this as proof of a natural fit; ours offers it as proof of how much we had already accomplished alone. The distinction matters enormously to perhaps four hundred people.\n\nPlatforma Obywatelska is part of our coalition. We are still working out how to present this as a new opening.\n"
 gmina_harmonization.5.a: "Uniting for modernization, prosperity, and European integration."
 gmina_harmonization.6.t: "Coalition with Nowoczesna"
 gmina_harmonization.6.d: "\n\n\n\n\n\n\nNowoczesna arrived with a presentation. It ran to ninety slides and was, everybody agrees, extremely good.\n\nTheir delegation is economists, consultants and one gentleman who has explained the digital transition on television so often that he can now do it in his sleep. They do not argue positions so much as demonstrate them, and it is genuinely awkward to disagree with a chart. Our own side responded by commissioning charts of its own, at which point the talks briefly became a contest nobody was winning.\n\nIn [Root.Capital.GetCapitalName] the ministries have been reorganised along the lines recommended on slide sixty-one. The reorganisation is proceeding well, according to slide sixty-two.\n\nNowoczesna is part of our coalition, and the follow-up presentation is already in the diary.\n"
 gmina_harmonization.6.a: "Bringing innovation and forward-thinking policies together."
 gmina_harmonization.7.t: "Coalition with Conservatives"
 gmina_harmonization.7.d: "\n\n\n\n\n\n\nThe Conservatives were not supposed to be in this coalition, and for the first six weeks everyone involved took care to keep saying so.\n\nTheir delegation was courteous, thoroughly prepared and entirely unmoved by anything said to them about the direction of history. They wanted the school curriculum, the family policy and a written guarantee about the monuments. In exchange they offered the one thing we did not have, which was a majority. Our negotiators discovered that a principle is considerably easier to defend in a studio than at a table where somebody is counting seats aloud.\n\nIn [Root.Capital.GetCapitalName] the resulting changes are small, precise and very carefully drafted, which is how one can tell they were the entire point.\n\nConservatism is part of our coalition. Both sides have agreed never to explain how.\n"
 gmina_harmonization.7.d.aws: "\n\n\n\n\n\n\nAWS is not so much a party as thirty of them sharing a name, and all thirty sent somebody to [conservatism_group_province.GetName].\n\nThe negotiation was therefore a series of negotiations, held simultaneously, occasionally contradicting one another in the same corridor. We now hold signed commitments to reform the health service, the schools, the pensions and the administration all at once, which their people assure us has been attempted before and went splendidly.\n\nIn [Root.Capital.GetCapitalName] nobody can say with confidence who speaks for our coalition partner. Their own deputies cannot say either."
 gmina_harmonization.7.d.kpn: "\n\n\n\n\n\n\nKPN sent us people who were being arrested for this sort of conversation while most of our movement was still at school.\n\nThey are not impressed by us and have no particular reason to be. Their founder built the first opposition party anywhere in the bloc, went to prison for it, and lived to see the state he predicted arrive and then disappoint him. The delegation in [conservatism_group_province.GetName] heard our offer out politely and asked only what we intended to do about sovereignty, a word they use without a trace of irony.\n\nIn [Root.Capital.GetCapitalName] they have taken defence and the archives. On reflection, both were always the price."
 gmina_harmonization.7.d.lpr: "\n\n\n\n\n\n\nLPR arrived in [conservatism_group_province.GetName] with a youth section, a list of titles to be removed from the school reading lists, and a settled opinion about Brussels.\n\nOur negotiators had prepared for a difficult conversation about economics and were entirely unprepared for one about the teaching of biology. The party has no interest in the budget. It is interested in what children are told, what may be broadcast, and which treaties might yet be reconsidered.\n\nIn [Root.Capital.GetCapitalName] the coalition is holding. The question of who is now responsible for the curriculum is being answered by everybody differently."
 gmina_harmonization.7.d.pc: "\n\n\n\n\n\n\nPorozumienie Centrum agreed to talk on condition that we began by discussing who, precisely, had done well out of the last forty years.\n\nWhat followed was not a conversation about the future at all. Their delegation has a list, has had it for some time, and treats every coalition as an opportunity to act on it. They were accommodating about the budget and utterly immovable about the archives, and left [conservatism_group_province.GetName] with the files they had come for.\n\nIn [Root.Capital.GetCapitalName] several senior officials have taken sudden and entirely unrelated retirement."
 gmina_harmonization.7.d.pis: "\n\n\n\n\n\n\nOf every coalition this movement swore it would never form, this is the one we spent the most airtime swearing about.\n\nThe delegation in [conservatism_group_province.GetName] was well aware of that and appeared to enjoy it thoroughly. They were disciplined, entirely unembarrassed, and structured their offer so that refusing it would have cost us more than accepting. They wanted the public broadcaster, the prosecution service, and the social programme left exactly as it stands. The last of these is popular enough that we were going to keep it regardless.\n\nIn [Root.Capital.GetCapitalName] our own voters are asking what the last four years of speeches were for. We are working on an answer."
 gmina_harmonization.7.d.psl: "\n\n\n\n\n\n\nPSL did not need to be persuaded. PSL needed to be told which ministry.\n\nThis is a party that has governed alongside communists, liberals and conservatives, has never been the largest partner, and has never been out of office for long. Their delegation in [conservatism_group_province.GetName] was relaxed to the point of boredom, produced a single sheet listing agriculture, rural development and the dairy sector, and asked whether there was anything further we wished to raise.\n\nThere was not. With PSL there never is."
 gmina_harmonization.7.d.zchn: "\n\n\n\n\n\n\nZChN opened by establishing which of our commitments are incompatible with the catechism, and the list ran longer than we had budgeted for.\n\nTheir negotiators are unfailingly courteous and entirely immovable. They did not want ministries so much as curricula, chaplaincies and the wording of three particular articles. The parish hall in [conservatism_group_province.GetName] where the talks were held had been booked, we later discovered, for the following six Thursdays.\n\nIn [Root.Capital.GetCapitalName] the education ministry now clears its announcements with people whose telephone numbers we did not previously possess."
 gmina_harmonization.7.a: "Balancing progress with respect for what people already believe."
 gmina_harmonization.8.t: "Coalition with Socialists"
 gmina_harmonization.8.d: "\n\n\n\n\n\n\nThe Left came to the table already knowing which ministry it wanted, which put it some way ahead of everyone else in the room.\n\nTheir negotiators are veterans of coalitions that ended badly and have the wariness to show for it. They asked for labour, social policy and housing, accepted a smaller share than their seats entitled them to, and spent the leverage they saved on a single commitment about pensions which they intend to hold us to in public, repeatedly, on camera.\n\nIn [Root.Capital.GetCapitalName] the social ministries have gained a seriousness they had been missing, along with a habit of publishing figures that neighbouring departments would rather not see in print.\n\nThe Socialists are part of our coalition, and have twice reminded us which page the pension clause is on.\n"
 gmina_harmonization.8.d.lewica: "\n\n\n\n\n\n\nThe Lewica delegation is a merger of three parties that spent years explaining why they could not possibly merge, and it shows in the seating.\n\nThey came to [socialism_group_province.GetName] with housing, the health service and a list of social commitments that are individually popular and collectively ruinous. Their younger members negotiate like activists and their older ones like ministers, and the two halves had to caucus twice before agreeing what they were asking for.\n\nIn [Root.Capital.GetCapitalName] they have taken housing, which every previous government has treated chiefly as somewhere to store the people it wished to be rid of."
 gmina_harmonization.8.d.sld: "\n\n\n\n\n\n\nSLD negotiates the way a law firm negotiates, which is not an accident.\n\nTheir people took the constitution, the European files and the foreign ministry, and were candid that they had done all of it before and would rather not have it explained to them again. Two of the delegation in [socialism_group_province.GetName] have been ministers, one has been president of something, and all of them were doing this while our founders were still choosing a logo.\n\nIn [Root.Capital.GetCapitalName] the machinery of government has begun moving noticeably faster, and nobody is entirely comfortable about why."
 gmina_harmonization.8.d.up: "\n\n\n\n\n\n\nUnia Pracy brought four people and one demand, which they had plainly rehearsed.\n\nThey are a small party of the genuine left that has spent its whole existence as somebody else's junior partner, and they came to [socialism_group_province.GetName] determined that this time the labour code would actually be written down. They did not ask for a ministry. They asked for a clause, and they got it, because it cost us nothing and they were the only people in the room who wanted it.\n\nIn [Root.Capital.GetCapitalName] the employers are already describing the clause as unworkable, which their delegation regards as confirmation that it was worth having."
 gmina_harmonization.8.a: "Labour, dignity and a floor nobody falls through."
 gmina_harmonization.9.t: "Coalition with Populists"
 gmina_harmonization.9.d: "\n\n\n\n\n\n\nThe Populists signed after a night of talks and a morning of denials, and the denials received the wider coverage.\n\nTheir delegation does not negotiate in the usual sense. It arrives with a list of grievances, reads them out, and waits to see which ones we are willing to be photographed agreeing with. Half the list was impossible, a quarter was already government policy, and the remaining quarter turned out to be precisely why four hundred thousand people voted for them.\n\nIn [Root.Capital.GetCapitalName] their deputies have made the chamber a great deal livelier. Attendance at sittings is up. So are the viewing figures for recordings of those sittings.\n\nThe Populists are part of our coalition, and the morning broadcasts have not been dull since.\n"
 gmina_harmonization.9.d.k15: "\n\n\n\n\n\n\nKukiz'15 does not have a programme so much as one demand, repeated until somebody agrees to it.\n\nThe demand is single-member constituencies, and the delegation in [populism_group_province.GetName] returned to it after every other subject, lunch included. Their deputies were elected by people voting against everybody else, which makes them awkward to bargain with: they have nothing to protect and no career to lose, and several of them say exactly that on air, cheerfully, most weeks.\n\nIn [Root.Capital.GetCapitalName] the electoral commission has been asked to prepare a report it has already prepared twice."
 gmina_harmonization.9.d.konfederacja: "\n\n\n\n\n\n\nKonfederacja arrived as two parties sharing one coat and spent a good deal of the session disagreeing with itself in front of us.\n\nOne half would like the state abolished on principle and the other would like it turned firmly in a direction of its own choosing. The single point they agree on is taxation, of which they would like considerably less. The delegation in [populism_group_province.GetName] was younger than any other we have received, better at the internet than all of them combined, and entirely untroubled by anything said about it afterwards.\n\nIn [Root.Capital.GetCapitalName] the finance ministry has been asked to cost their proposals and has requested more time."
 gmina_harmonization.9.d.ppu: "\n\n\n\n\n\n\nThe Polska Partia Uczciwoœci delegation consisted of the senator, the director of his senatorial office, and a bench of consultants who had been sitting outside the shop in [populism_group_province.GetName] since well before breakfast.\n\nTheir programme promises lower taxes and higher benefits in adjacent paragraphs, defends the age-old role of the parish, and treats Brussels as a misunderstanding that will sort itself out. Not one commitment in it survives contact with arithmetic, and every single one of them polls magnificently.\n\nIn [Root.Capital.GetCapitalName] the senator has requested a ministry, an official car, and a second car for his brother."
 gmina_harmonization.9.d.rp: "\n\n\n\n\n\n\nThe Ruch Palikota delegation opened the talks in [populism_group_province.GetName] with a stunt, because that is how they open everything.\n\nTheir leader is a businessman who worked out that outrage is cheaper than advertising and has been buying it wholesale ever since. Behind the theatre the demands are consistent and genuinely awkward for us: the concordat, the Church's finances, and several questions about schooling that our other partners have made clear are not to be raised.\n\nIn [Root.Capital.GetCapitalName] the press office now keeps its mornings clear, on the reasonable assumption that something will have happened overnight."
 gmina_harmonization.9.d.samoobrona: "\n\n\n\n\n\n\nSamoobrona negotiated the way Samoobrona does everything, which is to say the tractors reached the edge of [populism_group_province.GetName] before the delegation reached the table.\n\nTheir leader does not hold private conversations. Every concession was announced publicly within the hour, generally with a figure attached that had not been agreed, and each denial we issued was taken as further proof that the talks were going well. He is genuinely popular among people no other party has spoken to in years.\n\nIn [Root.Capital.GetCapitalName] the agriculture ministry has changed hands and the road leading to it is, for the moment, clear."
 gmina_harmonization.9.a: "The anger was real. Better it sits at the table than outside it."
 gmina_harmonization.10.t: "Coalition with Catholics"
 gmina_harmonization.10.d: "\n\n\n\n\n\n\nThe arrangement with the Church was never called a coalition and was not, in any sense anyone would testify to, negotiated.\n\nThere were conversations. They took place over several months, in a building nobody photographed us entering, and concluded in a communique worded so carefully that both sides can point at the same paragraph and mean entirely different things by it. The Church asked for very little, because the Church seldom has to. It simply established, gently and without raising its voice, which subjects would not be coming up.\n\nIn [Root.Capital.GetCapitalName] the effect is visible mainly in what has quietly stopped being proposed.\n\nWe cooperate with the Church now, on the matters the Church has agreed are open to cooperation.\n"
 gmina_harmonization.10.a: "Upholding moral values and family principles in governance."
 gmina_harmonization.20.t: "Coalition with Silesians"
 gmina_harmonization.20.d: "\n\n\n\n\n\n\nThe Silesians did not so much join our coalition as agree to consider us, provisionally, on terms they drafted themselves and forwarded to us for signature.\n\nTheir delegation opened by correcting our pronunciation and closed by correcting our history, and in between secured guarantees on the language, the mines, and the share of the revenue that stays where it is dug out of the ground. They were the only partners to arrive with a map. They were also the only ones to bring two.\n\nIn [Root.Capital.GetCapitalName] this is being presented as a triumph of regional dialogue. In Katowice it is being presented as the first instalment.\n"
 gmina_harmonization.20.a: "Honoring regional identity while fostering national unity."
 gmina_harmonization.11.t: "A Question of Names"
 gmina_harmonization.11.d: "The talks in [harmonization_province.GetName] have stalled, and not over anything so vulgar as policy.\n\nOur delegation has now spent three sessions defending the word dialogue. The [harmonization_province.Religion.GetName] side maintains that whatever is happening at that table is plainly a coalition, and has already had the letterhead printed to settle the matter. The evening broadcasts have arrived at a third description, shorter than both and considerably less flattering.\n\nOur press office issues a correction after every bulletin. The corrections have quietly become the story.\n"
 gmina_harmonization.11.a: "We are a movement. We open dialogues, we do not join coalitions."
 gmina_harmonization.11.b: "Let them call it whatever keeps them in the room."
 gmina_harmonization.12.t: "The Programme, Retranslated"
 gmina_harmonization.12.d: "Activists in [harmonization_province.GetName] have brought out their own edition of our programme, rendered into the language their voters actually use.\n\nOur commitment to civic renewal now reads as a list of demands. Our openness to every side of the argument now reads as a promise to finally choose one. The editors insist that nothing has been altered, merely clarified, and in all fairness their version is far easier to get through than ours.\n\nIt is also selling better in [harmonization_province.GetName] than the original has managed anywhere.\n"
 gmina_harmonization.12.a: "Being read matters more than being quoted accurately."
 gmina_harmonization.12.b: "That is not our programme in their words. That is their programme."
 gmina_harmonization.13.t: "The Card of [Root.Adm_Advisor.GetName]"
 gmina_harmonization.13.d: "A reporter in [harmonization_province.GetName] has established that [Root.Adm_Advisor.GetName], who drafts a good deal of what we announce, has held a [harmonization_province.Religion.GetName] membership card the entire time.\n\n[Root.Adm_Advisor.GetName] does not deny it and seems faintly puzzled that anybody minds, having assumed that a movement open to everyone was also open to [Root.Adm_Advisor.GetHerHim].\n\nIt is a difficult argument to answer without conceding the whole premise of the last four years.\n"
 gmina_harmonization.13.a: "Have [Root.Adm_Advisor.GetHerHim] clear the desk by lunchtime."
 gmina_harmonization.13.b: "We said every side. We are now obliged to mean it."
 gmina_harmonization.14.t: "Matters of Protocol"
 gmina_harmonization.14.d: "The [harmonization_province.Religion.GetName] organisation in [harmonization_province.GetName] has its own way of doing things: who speaks first, whose banner hangs where, which anniversary closes the local offices.\n\nNone of it is written down anywhere, and all of it is defended as though it were carved somewhere permanent. Our regional coordinator has requested guidance, having already caused two incidents by sitting in the wrong chair.\n\nThe local press is covering the seating arrangements with rather more attention than it ever gave our manifesto.\n"
 gmina_harmonization.14.a: "There will be one standard, and it will be ours."
 gmina_harmonization.14.b: "Let them keep their chairs. We need their votes."
 gmina_harmonization.15.t: "Strengthening the Office of [Root.Monarch.GetTitle]"
 gmina_harmonization.15.d: "The [harmonization_province.Religion.GetName] negotiators have tabled a proposal nobody expected from them: that the office of [Root.Monarch.GetTitle] be given considerably more room to act without consulting anyone first.\n\nThey present it as the logical conclusion of everything we have been saying about ending paralysis and finally getting things done. They are, irritatingly, quoting us accurately.\n\nOur own people are divided between those who find the offer alarming and those who have already begun drafting the enabling paperwork.\n"
 gmina_harmonization.15.a: "A decisive hand is what the country keeps asking for."
 gmina_harmonization.15.b: "We did not spend ten years opposing this to sign it now."
 gmina_harmonization.16.t: "Agitators of the Third Way"
 gmina_harmonization.16.d: "Our structures in [harmonization_province.GetName] report that the local [harmonization_province.Religion.GetName] membership is receptive, courteous, and entirely uninterested in changing anything at all.\n\nThe proposal on the table is to send our ablest agitators out there to explain the programme properly, in person, for however long it takes. The agitators in question have studied the map and asked several careful questions about the accommodation.\n\nThe alternative is to leave [harmonization_province.GetName] to run itself and stop pretending that we supervise it.\n"
 gmina_harmonization.16.a: "Let them govern themselves. They were going to regardless."
 gmina_harmonization.16.b: "Send our best people. Somebody has to do the explaining."
 gmina_harmonization.17.t: "What [harmonization_province.Religion.GetName] Built"
 gmina_harmonization.17.d: "[harmonization_province.GetName] has finished a project that genuinely works, on time and approximately on budget, run from start to end by the local [harmonization_province.Religion.GetName] administration.\n\nThe national broadcasters have already been out to film it. Our communications people are weighing two options: praise it warmly and share the credit, or fold the whole undertaking into the national programme and let the credit sort itself out afterwards.\n\nThe second option is being described internally as ambitious.\n"
 gmina_harmonization.17.a: "Good work deserves saying so, publicly and by name."
 gmina_harmonization.17.b: "This is a national achievement now. See that it is presented as one."
 gmina_harmonization.18.t: "A Successor Nobody Chose"
 gmina_harmonization.18.d: "The question of who follows [Root.Monarch.GetName] has been settled in the corridors rather than at the congress, and the name that came out of them is [Root.Heir.GetName].\n\n[Root.Heir.GetName] owes the position entirely to the [harmonization_province.Religion.GetName] faction, has said as much on the record, and appears to regard the movement that actually won the election as a temporary inconvenience to be managed.\n\nWe may install somebody of our own and explain ourselves afterwards, or accept the arrangement and live with everything it will breed.\n"
 gmina_harmonization.18.a: "The succession belongs to the movement, not to its guests."
 gmina_harmonization.18.b: "We need their faction rather more than we need a gracious heir."
 gmina_harmonization.19.t: "The Book Everyone Has Read"
 gmina_harmonization.19.d: "A writer from [harmonization_province.GetName] has produced a short and extremely funny account of the last two years of dialogue, in which nobody is named and everybody is recognisable.\n\nIt has sold out three printings. Our own deputies are reading it on trains without troubling to hide the cover, and at least two have been quoted identifying which chapter is about them.\n\nThe author has offered to discuss any passage we consider unfair, which is exactly the sort of reasonable offer that makes banning the thing impossible to explain.\n"
 gmina_harmonization.19.a: "Let them laugh. We lead by example, not by decree."
 gmina_harmonization.19.b: "Pull it from the shops before the second volume appears."
 gmina_harmonization.21.t: "The Competitive Examination"
 gmina_harmonization.21.d: "Our partners have begun asking, with steadily increasing directness, how posts in the administration are actually filled.\n\nThe honest answer is that they are filled by whoever the movement trusts. That was a virtue while the movement was small and is becoming an embarrassment now that it is not. A proposal has been drafted for open examinations, published criteria and a genuine appeals procedure. It would cost a great deal, take years, and strip several people in this room of the only currency they have.\n\nThe alternative is to carry on exactly as we are and stop pretending the question was asked in good faith.\n"
 gmina_harmonization.21.a: "Open the service to anyone who can pass the examination."
 gmina_harmonization.21.b: "The people who built this movement will be the ones who staff it."
 harmonization_classics_translated:0 "Programme Retranslated"
 desc_harmonization_classics_translated:0 "Our programme circulates in a version we did not write, and it is doing rather better than ours."
 harmonization_classics_defended:0 "Programme Defended"
 desc_harmonization_classics_defended:0 "We insisted on the original wording, and our partners have stopped quoting us at all."
 harmonization_converted_minister:0 "A Minister with a Card"
 desc_harmonization_converted_minister:0 "One of our ministers turned out to belong to somebody else's party, and we kept them regardless."
 harmonization_local_rites_refused:0 "Local Customs Refused"
 desc_harmonization_local_rites_refused:0 "We told a proud region how its own ceremonies would be conducted, and it has not forgotten."
 harmony_banned_book:0 "The Banned Bestseller"
 desc_harmony_banned_book:0 "We withdrew a book that mocked us, which proved to be the finest publicity it could have had."
 harmonized_communism_group: "Coalition with Communists"
 desc_harmonized_communism_group: "The Communists sit in our coalition, and we have quietly kept the parts of their programme that still poll well."
 harmonized_liberalism_ud: "Coalition with UD"
 desc_harmonized_liberalism_ud: "Unia Demokratyczna has joined our coalition, and its habit of debating every point twice arrived with it."
 harmonized_liberalism_kld: "Coalition with KLD"
 desc_harmonized_liberalism_kld: "Kongres Liberalno-Demokratyczny sits in our coalition and has taken charge of anything involving a budget."
 harmonized_liberalism_uw: "Coalition with UW"
 desc_harmonized_liberalism_uw: "Unia Wolnoœci has joined our coalition, and its lawyers have proved rather more useful than expected."
 harmonized_liberalism_PO: "Coalition with PO"
 desc_harmonized_liberalism_PO: "Platforma Obywatelska has joined our coalition, which every commentator insists was the plan all along."
 harmonized_liberalism_N: "Coalition with N"
 desc_harmonized_liberalism_N: "Nowoczesna is part of our coalition, along with a great many presentations nobody has finished reading."
 harmonized_conservatism_group: "Coalition with Conservatives"
 desc_harmonized_conservatism_group: "The Conservatives sit in our coalition, and both sides have agreed never to explain exactly how."
 harmonized_socialism_group: "Coalition with Socialists"
 desc_harmonized_socialism_group: "The Socialists have joined our coalition and secured the one ministry nobody else wanted."
 harmonized_populism_group: "Coalition with Populists"
 desc_harmonized_populism_group: "The Populists are in our coalition, and the morning broadcasts have not been dull since."
 harmonized_christian: "Cooperation with Catholic Church"
 desc_harmonized_christian: "We cooperate with the Church, on the matters the Church has agreed are open to cooperation."
 harmonized_silesian_group: "Cooperation with Silesians"
 desc_harmonized_silesian_group: "The Silesians cooperate with us, on terms they drafted themselves and sent over for signature."

