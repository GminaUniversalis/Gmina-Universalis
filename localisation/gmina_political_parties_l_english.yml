 reform_tax_system: "Reform Tax System"
 desc_reform_tax_system: "Reforming the tax system to make it more efficient, fair and transparent, while ensuring that the revenue generated is used for the betterment of our populace"
 reduce_bureaucracy: "Reduce Bureaucracy"
