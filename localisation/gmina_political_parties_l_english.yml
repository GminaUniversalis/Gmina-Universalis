 po_events.1.t: "Administrative Reforms"
 po_events.1.d: "\n\n\n\n\n\n\nThe government is planning significant administrative changes to improve efficiency and accessibility in public services. These initiatives focus on promoting regional economic growth, streamlining access to public services through digital solutions, and reorganizing local government structures to reduce redundancies and optimize resource use. The reforms aim to create a more effective and citizen-friendly administration while enhancing economic competitiveness and governance."
 po_events.1.a: "Decentralize the management of EU funds"
 po_events.1.b: "Establish shared service centers"
 po_events.1.c: "Reorganize provincial and district offices"
 decentralized_managament: "Decentralized Managament"
 shared_service_centers: "Shared Service Centers"

 po_events.2.t: "Financial Reforms"
 po_events.2.d: "\n\n\n\n\n\n\nThe government is introducing financial reforms to enhance transparency, stability, and efficiency in the public finance system. These changes aim to improve the allocation of resources, ensure better oversight of public expenditures, and strengthen support for local development initiatives. By fostering fiscal responsibility and streamlining budget processes, the reforms are expected to contribute to long-term economic growth and stability."
 po_events.2.a: "Introduce the spending rule"
 po_events.2.b: "Reform the pension system"
 po_events.2.c: "Reduction pension contribution for employers"
 spending_rule: "Spending Rule"
 reformed_pension_system: "Reformed Pension System"

 po_events.3.t: "Social Reforms"
 po_events.3.d: "\n\n\n\n\n\n\nThe government is planning social reforms to improve the quality of life and strengthen support systems for citizens. These changes focus on expanding access to education and healthcare, enhancing social benefits for vulnerable groups, and promoting equal opportunities in the labor market. The reforms aim to create a more inclusive and supportive society, ensuring that essential services are accessible to all while fostering social cohesion."
 po_events.3.a: "Expand social welfare program for large families"
 po_events.3.b: "Introduce one-year maternity leave"
 po_events.3.c: "Raise benefits for unemployed"
 social_welfare_program: "Social Welfare Program"
 introduced_maternity_leave: "Maternity Leave"

 po_events.4.t: "Pro European Movement"
 po_events.4.d: "\n\n\n\n\n\n\nThe government is committed to pro-European initiatives, focusing on deepening Poland's integration within the European Union. This includes actively supporting the ratification of the Lisbon Treaty, which strengthened the EU’s decision-making processes and enhanced Poland’s role in EU governance. Additionally, Poland has played a key role in assisting with the creation of EU cohesion reforms, working to ensure that the benefits of EU membership are more equitably distributed across all member states. These actions reflect Poland's commitment to strengthening the EU and promoting greater political, economic, and social integration within Europe."
 po_events.4.a: "Prepare our entry into the eurozone"
 po_events.4.b: "Assistance in EU cohesion policy reform"
 po_events.4.c: "Adopt the Treaty of Lisbon"
 euro_preparations: "Euro Preparations"
 assistance_in_EU_politics: "European Politics"

 po_events.5.t: "Closer Ties With the East" 
 po_events.5.d: "\n\n\n\n\n\n\nThe government is implementing reforms aimed at strengthening ties with Eastern neighbors to promote regional stability and cooperation. These efforts focus on enhancing economic partnerships, supporting infrastructure projects, and fostering cultural and diplomatic exchanges. By deepening collaboration with countries to the east, the reforms aim to build stronger political alliances, expand trade opportunities, and contribute to mutual development in the region."
 po_events.5.a: "Eastern Partnership Initiative"
 po_events.5.b: "Energy cooperation with eastern countries"
 po_events.5.c: "Political support for Georgia"
 eastern_partnership: "Eastern Partnership"
 energy_cooperation: "Energy Cooperation"

 po_events.6.t: "Prepare Sporting Events"
 po_events.6.d: "\n\n\n\n\n\n\nThe government is introducing reforms to promote the development of sports and physical activity across the country, with a particular focus on preparations for hosting Euro 2012. These initiatives include improving sports infrastructure, supporting young athletes through training programs, and increasing access to recreational facilities for all citizens. By fostering a culture of physical activity and enhancing opportunities in both professional and amateur sports, the reforms aim to improve public health, nurture talent, and showcase Poland’s capabilities on the international stage."
 po_events.6.a: "Construction of stadium infrastructure"
 po_events.6.ab: "§gConstruction of stadium infrastructure§!"
 po_events.6.b: "“Orlik 2012” program"
 po_events.6.c: "Establish scholarship programs for athletes" 
 stadium_infrastructure: "Stadium Infrastructure"
 sport_reform_long_term_solution: "Recent Investment in Stadium Infrastructure"
 orlik_2012: "Orlik 2012"

 po_events.7.t: "Reform Electoral System"
 po_events.7.d: "\n\n\n\n\n\n\nThe government is planning reforms to modernize the electoral system, aiming to enhance transparency, accessibility, and fairness in elections. These initiatives focus on simplifying voting procedures, introducing mechanisms to increase voter participation, and improving oversight of campaign financing. By strengthening the integrity of the electoral process, the reforms aim to build greater public trust and ensure that elections are more representative and inclusive."
 po_events.7.a: "Introduce single-mandate electoral districts"
 po_events.7.b: "Introduce postal voting for people with disabilities"
 po_events.7.c: "Change the electoral laws for the European Parliament"
 SM_electoral_districts: "Single-Mandate Electoral Districts"
 postal_voting: "Postal Voting"

 po_events.8.t: "Limit Subsidies to Political Parties"
 po_events.8.d: "\n\n\n\n\n\n\nThe government is proposing reforms to limit subsidies for political parties, aiming to promote greater fiscal responsibility and fairness in the political system. These changes focus on reducing public funding, introducing stricter spending limits, and encouraging parties to seek alternative, transparent sources of financing. By optimizing the allocation of public funds, the reforms aim to ensure a more balanced political landscape while reducing the financial burden on taxpayers."
 po_events.8.a: "Audit reform of political party funding"
 po_events.8.b: "Adjust public funding of political parties"
 po_events.8.c: "Introduce limits on election campaign spending"
 political_autdit: "Political Audit"
 public_funding_adjusted: "Public Funding Adjusted"

 po_events.9.t: "Tight Regulations"
 po_events.9.d: "\n\n\n\n\n\n\nThe government is planning reforms to tighten regulations in key sectors to ensure greater accountability, transparency, and protection for citizens. These initiatives focus on strengthening oversight in areas such as financial markets, public procurement, and environmental standards. By enhancing regulatory frameworks, the reforms aim to reduce risks, prevent abuses, and promote long-term stability and sustainability in both the public and private sectors."
 po_events.9.a: "Reform labor market regulations and employment protection"
 po_events.9.b: "Tight regulations on lobbying"
 po_events.9.c: "Introduce anti-corruption law"
 labor_market_reform: "Labor Market Reform"
 lobbying_denied: "Lobbying Denied"

