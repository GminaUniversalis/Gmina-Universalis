 reinforce_democracy: "Reinforce Democracy"
 desc_reinforce_democracy: "Encouraging more participation and representation of citizens in political processes to strengthen democracy"
 fight_corruption: "Fight Corruption"
 desc_fight_corruption: "Fighting corruption in government and in public institutions to maintain public trust and improve transparency"
 education_and_innovativeness: "Education and Innovativeness"
